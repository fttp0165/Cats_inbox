# Alembic 設定。連線字串刻意**不寫在這裡**——由 alembic/env.py 自 env 讀取,
# 避免 secret 進 git(共通紅線),也避免本檔與 .env 出現兩個真相。
[alembic]
script_location = alembic
prepend_sys_path = .

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" font-family="-apple-system,'Segoe UI','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13">
  <!-- cats-inbox UI 概念圖(light 主題、無外部依賴;憲法第四條5)
       五個畫面的線框。🔴 未實作的畫面以虛線 + 灰字標示。
       🔴 收件匣頁刻意畫不出任何人名 —— 那不是省略,是規格(§4.2a L1)。 -->
  <rect width="980" height="760" fill="#ffffff"/>
  <text x="490" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2328">cats-inbox 使用者介面概念圖</text>
  <text x="490" y="45" text-anchor="middle" font-size="11" fill="#57606a">伺服器端算繪 · Bootstrap 5 本地託管 · light 主題 · 零外部 CDN</text>

  <!-- ══════ ① 入口首頁 + 鈴鐺 ══════ -->
  <text x="24" y="76" font-size="12" font-weight="bold" fill="#1f6feb">① 統一入口首頁(portal-landing,T12 加鈴鐺)</text>
  <rect x="24" y="86" width="440" height="182" rx="6" fill="#ffffff" stroke="#afb8c1" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="24" y="86" width="440" height="34" rx="6" fill="#f6f8fa" stroke="#afb8c1" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="40" y="108" font-size="11.5" font-weight="bold" fill="#57606a">CATS 統一入口</text>
  <!-- 鈴鐺 -->
  <circle cx="404" cy="103" r="13" fill="#eef4fb" stroke="#4a6785" stroke-width="1.5"/>
  <text x="404" y="108" text-anchor="middle" font-size="12">🔔</text>
  <circle cx="414" cy="94" r="8" fill="#cf222e"/>
  <text x="414" y="98" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">3</text>
  <text x="436" y="108" text-anchor="middle" font-size="11" fill="#57606a">登出</text>

  <rect x="44" y="136" width="120" height="52" rx="5" fill="#f6f8fa" stroke="#d8dee4"/>
  <text x="104" y="166" text-anchor="middle" font-size="11" fill="#57606a">PLM</text>
  <rect x="176" y="136" width="120" height="52" rx="5" fill="#f6f8fa" stroke="#d8dee4"/>
  <text x="236" y="166" text-anchor="middle" font-size="11" fill="#57606a">Sporton Core</text>
  <rect x="308" y="136" width="120" height="52" rx="5" fill="#eef4fb" stroke="#4a6785" stroke-width="1.5"/>
  <text x="368" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f2328">站內信</text>
  <text x="368" y="177" text-anchor="middle" font-size="10" fill="#57606a">/inbox/</text>

  <text x="44" y="214" font-size="10.5" fill="#57606a">鈴鐺每 30 秒打一次 GET /inbox/api/v1/messages/unread-count</text>
  <text x="44" y="232" font-size="10.5" fill="#cf222e">🔴 漸進增強:inbox 或 IdP 掛掉時鈴鐺消失,不得擋住首頁</text>
  <text x="44" y="252" font-size="10.5" fill="#8b949e">⏳ 尚未實作(portal 側,T12)</text>

  <!-- ══════ ② 收件匣頁 ══════ -->
  <text x="516" y="76" font-size="12" font-weight="bold" fill="#1f6feb">② 收件匣頁 GET /inbox/ ✅ 已實作</text>
  <rect x="516" y="86" width="440" height="356" rx="6" fill="#ffffff" stroke="#4a6785" stroke-width="1.8"/>
  <rect x="516" y="86" width="440" height="38" rx="6" fill="#f6f8fa" stroke="#4a6785" stroke-width="1.8"/>
  <text x="534" y="111" font-size="13" font-weight="bold" fill="#1f2328">收件匣</text>
  <rect x="592" y="98" width="56" height="18" rx="9" fill="#1f6feb"/>
  <text x="620" y="111" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">3 未讀</text>
  <rect x="878" y="96" width="60" height="22" rx="4" fill="#ffffff" stroke="#8b949e"/>
  <text x="908" y="111" text-anchor="middle" font-size="10.5" fill="#57606a">登出</text>

  <!-- 公告卡(T09):排在訊息之前 —— 公告通常有時效,排在下面等於沒發 -->
  <rect x="534" y="138" width="404" height="56" rx="5" fill="#ffffff" stroke="#d8dee4"/>
  <rect x="534" y="138" width="4" height="56" fill="#bf8700"/>
  <rect x="550" y="148" width="40" height="16" rx="8" fill="#bf8700"/>
  <text x="570" y="160" text-anchor="middle" font-size="9.5" fill="#ffffff">公告</text>
  <rect x="598" y="148" width="40" height="16" rx="8" fill="#1f6feb"/>
  <text x="618" y="160" text-anchor="middle" font-size="9.5" fill="#ffffff">未讀</text>
  <text x="550" y="180" font-size="11.5" font-weight="bold" fill="#1f2328">系統維護公告:8/30 停機 02:00–04:00</text>
  <text x="782" y="180" font-size="9.5" fill="#57606a">有效期 starts / ends</text>

  <!-- 未讀卡片 -->
  <rect x="534" y="194" width="404" height="66" rx="5" fill="#ffffff" stroke="#d8dee4"/>
  <rect x="534" y="194" width="4" height="66" fill="#1f6feb"/>
  <rect x="550" y="206" width="72" height="16" rx="8" fill="#6e7781"/>
  <text x="586" y="218" text-anchor="middle" font-size="9.5" fill="#ffffff">workorder</text>
  <rect x="630" y="206" width="40" height="16" rx="8" fill="#1f6feb"/>
  <text x="650" y="218" text-anchor="middle" font-size="9.5" fill="#ffffff">未讀</text>
  <text x="550" y="238" font-size="11.5" font-weight="bold" fill="#1f2328">工單 WO-2026-0413 已指派給你</text>
  <text x="550" y="253" font-size="10" fill="#57606a">2026-08-25 09:12 · 內容純文字,輸出必跳脫</text>

  <!-- 未讀卡片 2 -->
  <rect x="534" y="270" width="404" height="66" rx="5" fill="#ffffff" stroke="#d8dee4"/>
  <rect x="534" y="270" width="4" height="66" fill="#1f6feb"/>
  <rect x="550" y="282" width="52" height="16" rx="8" fill="#6e7781"/>
  <text x="576" y="294" text-anchor="middle" font-size="9.5" fill="#ffffff">系統</text>
  <text x="550" y="314" font-size="11.5" font-weight="bold" fill="#1f2328">系統維護通知:8/30 02:00–04:00</text>
  <rect x="550" y="320" width="80" height="18" rx="4" fill="#1f6feb"/>
  <text x="590" y="333" text-anchor="middle" font-size="9.5" fill="#ffffff">前往處理</text>
  <text x="642" y="333" font-size="9.5" fill="#57606a">action_url 只接受同站值</text>

  <!-- 已讀卡片 -->
  <rect x="534" y="346" width="404" height="52" rx="5" fill="#fafbfc" stroke="#d8dee4"/>
  <rect x="534" y="346" width="4" height="52" fill="#d8dee4"/>
  <rect x="550" y="356" width="52" height="16" rx="8" fill="#8b949e"/>
  <text x="576" y="368" text-anchor="middle" font-size="9.5" fill="#ffffff">sporton</text>
  <text x="550" y="388" font-size="11.5" fill="#57606a">報價單已核可(已讀)</text>

  <text x="534" y="418" font-size="10.5" fill="#cf222e">🔴 全頁零人名 —— 寄件人一律以 source_app 標籤呈現</text>
  <text x="534" y="434" font-size="10" fill="#57606a">登入身分只顯示自己的 sub;⚠ 無分頁(limit 50)、公告發布尚無畫面(T09b)</text>

  <!-- ══════ ③ 待開通頁 ══════ -->
  <text x="24" y="308" font-size="12" font-weight="bold" fill="#1f6feb">③ 待開通頁 /inbox/pending ✅</text>
  <rect x="24" y="318" width="220" height="150" rx="6" fill="#ffffff" stroke="#4a6785" stroke-width="1.8"/>
  <text x="134" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2328">帳號待開通</text>
  <text x="134" y="372" text-anchor="middle" font-size="10.5" fill="#57606a">你已登入,但尚未取得權限</text>
  <rect x="42" y="386" width="184" height="30" rx="4" fill="#f6f8fa" stroke="#d8dee4"/>
  <text x="134" y="405" text-anchor="middle" font-size="9.5" fill="#24292f" font-family="monospace">1111…5555</text>
  <text x="134" y="434" text-anchor="middle" font-size="10" fill="#57606a">請把上面這串交給管理員</text>
  <text x="134" y="452" text-anchor="middle" font-size="10" fill="#cf222e">🔴 顯示自己的 sub 解「雞生蛋」</text>

  <!-- ══════ ④ 已登出頁 ══════ -->
  <text x="268" y="308" font-size="12" font-weight="bold" fill="#1f6feb">④ 已登出頁 /inbox/logged-out/ ✅</text>
  <rect x="268" y="318" width="196" height="150" rx="6" fill="#ffffff" stroke="#4a6785" stroke-width="1.8"/>
  <text x="366" y="356" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2328">你已登出</text>
  <text x="366" y="380" text-anchor="middle" font-size="10.5" fill="#57606a">站內信的登入狀態已清除</text>
  <rect x="316" y="398" width="100" height="28" rx="4" fill="#1f6feb"/>
  <text x="366" y="417" text-anchor="middle" font-size="11" fill="#ffffff">重新登入</text>
  <text x="366" y="446" text-anchor="middle" font-size="10" fill="#cf222e">🔴 不直接導登入頁</text>
  <text x="366" y="461" text-anchor="middle" font-size="9.5" fill="#57606a">否則看不出登出成功沒有</text>

  <!-- ══════ ⑤ 角色後台 ══════ -->
  <text x="24" y="500" font-size="12" font-weight="bold" fill="#1f6feb">⑤ 角色後台 /inbox/admin/users ✅(需 admin)</text>
  <rect x="24" y="510" width="440" height="176" rx="6" fill="#ffffff" stroke="#4a6785" stroke-width="1.8"/>
  <rect x="24" y="510" width="440" height="32" rx="6" fill="#f6f8fa" stroke="#4a6785" stroke-width="1.8"/>
  <text x="42" y="531" font-size="11.5" font-weight="bold" fill="#1f2328">使用者與角色</text>

  <line x1="24" y1="562" x2="464" y2="562" stroke="#d8dee4"/>
  <text x="42" y="557" font-size="10" font-weight="bold" fill="#57606a">sub</text>
  <text x="200" y="557" font-size="10" font-weight="bold" fill="#57606a">顯示名稱(快取)</text>
  <text x="330" y="557" font-size="10" font-weight="bold" fill="#57606a">角色</text>

  <text x="42" y="582" font-size="9.5" fill="#24292f" font-family="monospace">1111…5555</text>
  <text x="200" y="582" font-size="10" fill="#24292f">陳○○</text>
  <text x="200" y="595" font-size="8.5" fill="#8b949e">更新於 08-25 09:10</text>
  <rect x="330" y="571" width="50" height="15" rx="7" fill="#3f8f45"/>
  <text x="355" y="583" text-anchor="middle" font-size="9" fill="#ffffff">reader</text>
  <rect x="386" y="571" width="60" height="15" rx="7" fill="#ffffff" stroke="#8b949e"/>
  <text x="416" y="583" text-anchor="middle" font-size="9" fill="#57606a">+ 指派</text>

  <line x1="24" y1="608" x2="464" y2="608" stroke="#eaeef2"/>
  <text x="42" y="628" font-size="9.5" fill="#24292f" font-family="monospace">2222…6666</text>
  <text x="200" y="628" font-size="10" fill="#8b949e">(未快取)</text>
  <rect x="330" y="617" width="50" height="15" rx="7" fill="#3f8f45"/>
  <text x="355" y="629" text-anchor="middle" font-size="9" fill="#ffffff">reader</text>
  <rect x="386" y="617" width="66" height="15" rx="7" fill="#bf8700"/>
  <text x="419" y="629" text-anchor="middle" font-size="9" fill="#ffffff">announcer</text>

  <text x="42" y="656" font-size="10" fill="#cf222e">🔴 顯示名稱只在這一頁出現(§4.2a L1:僅供管理後台)</text>
  <text x="42" y="672" font-size="10" fill="#57606a">附整批 + 單筆清除工具;授權判定一律不讀它</text>

  <!-- ══════ 右下:三條 UI 紅線 ══════ -->
  <rect x="516" y="466" width="440" height="276" rx="6" fill="#fffbf0" stroke="#bf8700" stroke-width="1.5"/>
  <text x="530" y="490" font-size="12.5" font-weight="bold" fill="#1f2328">🔴 三條會被違反而沒有錯誤訊息的 UI 紅線</text>

  <text x="530" y="518" font-size="11.5" font-weight="bold" fill="#24292f">1. 零外部 CDN(契約 §4.10)</text>
  <text x="530" y="536" font-size="10.5" fill="#24292f">Bootstrap 本地託管於 /inbox/assets/vendor/。</text>
  <text x="530" y="552" font-size="10.5" fill="#57606a">⚠ 檔案不在 StaticFiles 掛載目錄下時 app 不送出去 ——</text>
  <text x="530" y="568" font-size="10.5" fill="#57606a">症狀是「整頁沒有樣式」而伺服器零錯誤(portal 踩過)。</text>

  <text x="530" y="598" font-size="11.5" font-weight="bold" fill="#24292f">2. body 純文字 + 輸出必跳脫</text>
  <text x="530" y="616" font-size="10.5" fill="#24292f">站內信是「使用者輸入直接展示給別人看」。</text>
  <text x="530" y="632" font-size="10.5" fill="#57606a">同源之下(D2″ 單一 hostname)一次 stored XSS</text>
  <text x="530" y="648" font-size="10.5" fill="#57606a">可觸及 IdP —— 這是本系統第一風險。</text>

  <text x="530" y="678" font-size="11.5" font-weight="bold" fill="#24292f">3. action_url 只接受同站值</text>
  <text x="530" y="696" font-size="10.5" fill="#24292f">/ 開頭的相對路徑,或 catsapp.sporton.com.tw 前綴;</text>
  <text x="530" y="712" font-size="10.5" fill="#57606a">其餘寫入時 400 拒收 —— 站內通知是現成的釣魚載具,</text>
  <text x="530" y="728" font-size="10.5" fill="#57606a">因為它天生就長得「可信」。</text>
</svg>

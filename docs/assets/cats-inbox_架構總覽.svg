<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="-apple-system,'Segoe UI','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13">
  <!-- cats-inbox 架構總覽(light 主題、無外部依賴;憲法第四條5) -->
  <rect width="900" height="620" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2328">cats-inbox 架構總覽(掛統一入口 /inbox/)</text>

  <!-- 使用者瀏覽器 -->
  <rect x="360" y="46" width="180" height="40" rx="6" fill="#eef4fb" stroke="#4a6785" stroke-width="1.5"/>
  <text x="450" y="71" text-anchor="middle" fill="#1f2328">使用者瀏覽器</text>

  <!-- browser -> gateway -->
  <line x1="450" y1="86" x2="450" y2="118" stroke="#4a6785" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="462" y="106" fill="#57606a" font-size="11">https(全 VM 只開 80/443)</text>

  <!-- gateway -->
  <rect x="180" y="120" width="540" height="46" rx="6" fill="#fdf3e4" stroke="#b95000" stroke-width="1.5"/>
  <text x="450" y="141" text-anchor="middle" font-weight="bold" fill="#1f2328">portal-gateway(全 VM 唯一入口,portal 擁有)</text>
  <text x="450" y="158" text-anchor="middle" font-size="11" fill="#57606a">路由權威:cats-portal gateway/nginx/conf.d/default.conf</text>

  <!-- cats-edge 虛線框 -->
  <rect x="40" y="196" width="820" height="210" rx="8" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="7 5"/>
  <text x="58" y="216" font-size="11" fill="#57606a">external network:cats-edge(只有各系統的「對外容器」在此)</text>

  <!-- gateway 分流線 -->
  <line x1="290" y1="166" x2="150" y2="238" stroke="#8c959f" stroke-width="1.2" marker-end="url(#arrowg)"/>
  <line x1="390" y1="166" x2="330" y2="238" stroke="#8c959f" stroke-width="1.2" marker-end="url(#arrowg)"/>
  <line x1="520" y1="166" x2="540" y2="238" stroke="#1a7f37" stroke-width="2" marker-end="url(#arrowb)"/>
  <line x1="640" y1="166" x2="750" y2="238" stroke="#8c959f" stroke-width="1.2" marker-end="url(#arrowg)"/>
  <text x="185" y="232" font-size="11" fill="#57606a">/</text>
  <text x="345" y="228" font-size="11" fill="#57606a">/auth/</text>
  <text x="555" y="228" font-size="11" font-weight="bold" fill="#1a7f37">/inbox/</text>
  <text x="712" y="228" font-size="11" fill="#57606a">/compliance/ /core/ /plm/ /upload/</text>

  <!-- landing -->
  <rect x="75" y="240" width="150" height="56" rx="6" fill="#f6f8fa" stroke="#4a6785"/>
  <text x="150" y="264" text-anchor="middle" fill="#1f2328">portal-landing</text>
  <text x="150" y="282" text-anchor="middle" font-size="11" fill="#57606a">入口首頁+未讀鈴鐺</text>

  <!-- keycloak -->
  <rect x="255" y="240" width="150" height="56" rx="6" fill="#f6f8fa" stroke="#4a6785"/>
  <text x="330" y="264" text-anchor="middle" fill="#1f2328">Keycloak(IdP)</text>
  <text x="330" y="282" text-anchor="middle" font-size="11" fill="#57606a">realm sporton · OIDC</text>

  <!-- cats-inbox-api -->
  <rect x="460" y="240" width="170" height="66" rx="6" fill="#e8f4ec" stroke="#1a7f37" stroke-width="2"/>
  <text x="545" y="263" text-anchor="middle" font-weight="bold" fill="#1f2328">cats-inbox-api</text>
  <text x="545" y="281" text-anchor="middle" font-size="11" fill="#57606a">FastAPI+Jinja2(本專案)</text>
  <text x="545" y="297" text-anchor="middle" font-size="11" fill="#57606a">只 expose 8080,不 publish</text>

  <!-- 其他系統 -->
  <rect x="680" y="240" width="150" height="56" rx="6" fill="#f6f8fa" stroke="#4a6785"/>
  <text x="755" y="264" text-anchor="middle" fill="#1f2328">各既有系統</text>
  <text x="755" y="282" text-anchor="middle" font-size="11" fill="#57606a">compliance/core/PLM/upload</text>

  <!-- 輪詢 -->
  <path d="M 150 296 L 150 350 L 460 350 L 460 306" fill="none" stroke="#4a6785" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="250" y="344" font-size="11" fill="#4a6785">每 30 秒輪詢 GET /inbox/api/v1/unread-count</text>

  <!-- S2S 推送 -->
  <path d="M 755 296 L 755 378 L 630 378 L 630 306" fill="none" stroke="#b95000" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowo)"/>
  <text x="646" y="372" font-size="11" fill="#b95000">S2S 推送(client_credentials,M5;契約章節定稿後開放)</text>

  <!-- OIDC 線 -->
  <path d="M 405 268 L 460 268" fill="none" stroke="#4a6785" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#arrow)"/>
  <text x="408" y="258" font-size="10" fill="#4a6785">OIDC</text>

  <!-- inbox 內部網 -->
  <rect x="430" y="440" width="300" height="120" rx="8" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="7 5"/>
  <text x="448" y="462" font-size="11" fill="#57606a">inbox 內部網(不上 cats-edge)</text>
  <line x1="545" y1="306" x2="545" y2="478" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#arrowb)"/>

  <!-- pg -->
  <rect x="460" y="480" width="240" height="60" rx="6" fill="#f6f8fa" stroke="#4a6785" stroke-width="1.5"/>
  <text x="580" y="505" text-anchor="middle" fill="#1f2328">cats-inbox-pg(PostgreSQL 15)</text>
  <text x="580" y="524" text-anchor="middle" font-size="11" fill="#57606a">不上 cats-edge、不對主機發布 port</text>

  <!-- 註解 -->
  <text x="60" y="590" font-size="11" fill="#57606a">身分:業務庫只存 sub(SSO 契約 v2.7)· 訊息 body 純文字+跳脫 · action_url 同站白名單 · 階段一 UI 零人名(§4.2a 缺口見計畫書 §2.3)</text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#4a6785"/></marker>
    <marker id="arrowg" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8c959f"/></marker>
    <marker id="arrowb" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1a7f37"/></marker>
    <marker id="arrowo" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#b95000"/></marker>
  </defs>
</svg>
